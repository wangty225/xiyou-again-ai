server
{
    listen 8002;
    listen [::]:8002;
    server_name xiyou-ai.wangty.top;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/xiyou-ai.wangty.top_8002;
    
    # 字符集
    charset utf-8;
    
    include /www/server/panel/vhost/nginx/extension/xiyou-ai.wangty.top/*.conf;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除并保持这段设置在优先级高的位置
    include /www/server/panel/vhost/nginx/well-known/xiyou-ai.wangty.top.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/html_xiyou-ai.wangty.top.conf;
    #REWRITE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 【修改1】JavaScript 文件 - 确保正确的 MIME 类型（支持 ES6 模块）+ 禁用缓存
    location ~ .*\.(js)$
    {
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        error_log /dev/null;
        access_log /dev/null;
    }

    # 【修改2】CSS 文件单独配置 + 禁用缓存
    location ~ .*\.(css)$
    {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # 【修改3】HTML 文件禁用缓存
    location ~ .*\.(html|htm)$
    {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        error_log /dev/null;
        access_log /dev/null;
    }

    # 【修改4】添加前端路由支持（单页应用必需）
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/xiyou-ai.wangty.top.log;
    error_log  /www/wwwlogs/xiyou-ai.wangty.top.error.log;
}
