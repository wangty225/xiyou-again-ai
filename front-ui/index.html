<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI话西游 - 身临其境书写你的取经传奇 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-red-50 min-h-screen">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none opacity-10">
        <div class="absolute top-10 left-10 text-9xl">☁️</div>
        <div class="absolute top-40 right-20 text-9xl">☁️</div>
        <div class="absolute bottom-20 left-1/4 text-9xl">☁️</div>
    </div>

    <!-- 主容器 -->
    <div class="relative z-10 container mx-auto px-4 py-8 max-w-7xl">
        <!-- 标题区域 -->
        <header class="text-center mb-12 animate-fade-in">
            <h1 class="text-5xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-red-600 via-orange-600 to-yellow-600 mb-4 drop-shadow-lg">
                AI话西游
            </h1>
            <p class="text-xl md:text-2xl text-gray-700 font-medium">化身西游人物，「AI第一人称演绎」独属你的西游八十一难 </p>
            <div class="mt-4 flex items-center justify-center gap-2 text-gray-600">
                <i class="fas fa-book-open"></i>
                <span>在游戏中学习名著，感受经典魅力</span>
            </div>
        </header>

        <!-- 游戏阶段容器 -->
        <div id="gameContainer" class="space-y-8">
            
            <!-- 章节选择阶段 -->
            <section id="chapterSelection" class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-8 md:p-12">
                <h2 class="text-3xl font-bold text-center mb-4 text-gray-800">
                    <i class="fas fa-book text-orange-600 mr-3"></i>
                    选择章节
                </h2>
                <p class="text-center text-gray-600 mb-8">
                    《西游记》共一百回，选择你想体验的章节开始冒险
                </p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-8 max-h-[600px] overflow-y-auto pr-2" id="chapterGrid">
                    <!-- 章节卡片将由JS动态生成 -->
                    <div class="text-center py-8 col-span-full">
                        <i class="fas fa-spinner fa-spin text-4xl text-orange-500"></i>
                        <p class="mt-4 text-gray-600">正在加载章节列表...</p>
                    </div>
                </div>
            </section>

            <!-- 角色选择阶段 -->
            <section id="characterSelection" class="hidden bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-8 md:p-12">
                <div class="flex items-center justify-between mb-6">
                    <button id="backToChapters" class="text-gray-600 hover:text-orange-600 transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>返回章节列表
                    </button>
                    <div id="selectedChapterInfo" class="text-orange-600 font-bold"></div>
                </div>
                
                <h2 class="text-3xl font-bold text-center mb-4 text-gray-800">
                    <i class="fas fa-users text-orange-600 mr-3"></i>
                    选择你的角色
                </h2>
                
                <!-- 章节上下文提示 -->
                <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl p-4 mb-8 text-center">
                    <p class="text-gray-700" id="chapterContextText">
                        根据所选章节，AI已为你生成了合适的角色
                    </p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8" id="characterGrid">
                    <!-- 角色卡片将由JS动态生成 -->
                </div>

                <div class="text-center">
                    <button id="startGameBtn" disabled class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-12 py-4 rounded-full text-xl font-bold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                        <i class="fas fa-play mr-2"></i>
                        开始冒险
                    </button>
                </div>
            </section>

            <!-- 游戏进行阶段 -->
            <section id="gamePlay" class="hidden">
                <!-- 进度条 -->
                <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl p-6 mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-lg font-semibold text-gray-700">
                            <i class="fas fa-map-marked-alt text-orange-600 mr-2"></i>
                            取经进度
                        </span>
                        <span class="text-lg font-bold text-orange-600" id="stepCounter">第 1/9 步</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                        <div id="progressBar" class="bg-gradient-to-r from-orange-500 to-red-500 h-4 rounded-full transition-all duration-500 shadow-inner" style="width: 11.11%"></div>
                    </div>
                </div>

                <!-- 当前角色信息 -->
                <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl p-6 mb-6">
                    <div class="flex items-center gap-4">
                        <img id="currentCharacterAvatar" src="" alt="" class="w-20 h-20 rounded-full object-cover border-4 border-orange-500 shadow-lg">
                        <div class="flex-1">
                            <h3 class="text-2xl font-bold text-gray-800" id="currentCharacterName"></h3>
                            <p class="text-gray-600" id="currentCharacterRole"></p>
                        </div>
                    </div>
                </div>

                <!-- 故事内容区 -->
                <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl p-8 mb-6">
                    <div class="mb-6">
                        <h3 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-scroll text-orange-600 mr-3"></i>
                            <span id="storyTitle">故事开始</span>
                        </h3>
                        <div id="storyContent" class="prose prose-lg max-w-none text-gray-700 leading-relaxed min-h-[150px]">
                            <!-- 故事内容将由JS动态生成 -->
                        </div>
                    </div>

                    <!-- 反馈提示框（用户选择不合理时显示） -->
                    <div id="feedbackBox" class="hidden bg-gradient-to-r from-yellow-50 to-amber-50 border-l-4 border-yellow-500 p-4 rounded-r-lg mb-4">
                        <p class="text-sm text-yellow-700 mb-1">
                            <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                            <strong>小提示：</strong>
                        </p>
                        <p class="text-yellow-800" id="feedbackText"></p>
                    </div>

                    <!-- 原著情节参考框 -->
                    <div id="originalPlotBox" class="hidden bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-500 p-4 rounded-r-lg mb-4">
                        <p class="text-sm text-blue-700 mb-1">
                            <i class="fas fa-book-reader text-blue-500 mr-2"></i>
                            <strong>原著情节：</strong>
                        </p>
                        <p class="text-blue-800" id="originalPlotText"></p>
                    </div>

                    <!-- 优美语句提示 -->
                    <div id="literaryQuote" class="hidden bg-gradient-to-r from-amber-50 to-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg">
                        <p class="text-sm text-gray-600 mb-1">
                            <i class="fas fa-quote-left text-orange-500 mr-2"></i>
                            <strong>优美语句学习：</strong>
                        </p>
                        <p class="text-gray-800 italic" id="quoteText"></p>
                    </div>
                </div>

                <!-- 选项区域 -->
                <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl p-8 mb-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-hand-pointer text-orange-600 mr-2"></i>
                        你的选择
                        <span class="text-sm font-normal text-gray-500 ml-2">(推荐选择符合原著的选项)</span>
                    </h3>
                    <div id="optionsContainer" class="space-y-3">
                        <!-- 选项将由JS动态生成 -->
                    </div>
                </div>

                <!-- 自由输入区 -->
                <div class="bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl p-8">
                    <h3 class="text-xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-pen-fancy text-orange-600 mr-2"></i>
                        自由发挥
                    </h3>
                    <p class="text-sm text-gray-500 mb-4">输入自定义行动（注意：自定义输入可能偏离原著情节）</p>
                    <div class="flex gap-3">
                        <input 
                            type="text" 
                            id="customInput" 
                            placeholder="输入你的想法或行动..." 
                            class="flex-1 px-6 py-4 border-2 border-gray-300 rounded-xl focus:border-orange-500 focus:outline-none text-lg transition-colors"
                        >
                        <button id="submitCustomBtn" class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-8 py-4 rounded-xl font-bold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300">
                            <i class="fas fa-paper-plane mr-2"></i>
                            提交
                        </button>
                    </div>
                </div>
            </section>

            <!-- 游戏结束阶段 -->
            <section id="gameEnd" class="hidden bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-8 md:p-12 text-center">
                <div class="mb-8">
                    <i class="fas fa-trophy text-yellow-500 text-7xl mb-4"></i>
                    <h2 class="text-4xl font-bold text-gray-800 mb-4">取经之路圆满</h2>
                    <p class="text-xl text-gray-600 mb-6" id="endingText"></p>
                </div>

                <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl p-6 mb-8">
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-star text-orange-600 mr-2"></i>
                        你的收获
                    </h3>
                    <div id="learningPoints" class="text-left space-y-2">
                        <!-- 学习要点将由JS动态生成 -->
                    </div>
                </div>

                <button id="restartBtn" class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-12 py-4 rounded-full text-xl font-bold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300">
                    <i class="fas fa-redo mr-2"></i>
                    重新开始
                </button>
            </section>
        </div>

    </div>

    <!-- 章节内容模态框 -->
    <div id="chapterModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between p-6 border-b">
                <h3 class="text-2xl font-bold text-gray-800" id="chapterModalTitle">章节标题</h3>
                <button id="closeChapterModal" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6" id="chapterModalContent">
                <!-- 章节内容 -->
            </div>
            <div class="p-6 border-t flex justify-end gap-4">
                <button id="startFromChapter" class="bg-gradient-to-r from-orange-500 to-red-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all">
                    <i class="fas fa-play mr-2"></i>
                    从本章开始游戏
                </button>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 shadow-2xl text-center">
            <div class="animate-spin text-6xl mb-4">🌀</div>
            <p class="text-xl font-bold text-gray-800">加载中...</p>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <!-- 调试工具（生产环境可删除） -->
    <script src="debug.js"></script>
</body>
</html>
